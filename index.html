<!DOCTYPE html>
<html lang="om" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Journal Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        dark: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            border: '#334155',
                            text: '#f8fafc'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased pb-12">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i class="fa-solid fa-chart-line text-xl"></i>
                </div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">
                    Trading Journal Pro
                </h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="exportToCSV()" class="text-xs sm:text-sm bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-2 rounded-lg border border-slate-700 transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> CSV Export
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 space-y-6">

        <!-- Stat Cards -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
            <div class="bg-slate-800/60 border border-slate-800 rounded-xl p-4">
                <span class="text-xs font-medium text-slate-400 block mb-1">Bu'aa/Kasaaraa Har'aa</span>
                <span id="stat-daily" class="text-lg sm:text-xl font-bold">$0.00</span>
            </div>
            <div class="bg-slate-800/60 border border-slate-800 rounded-xl p-4">
                <span class="text-xs font-medium text-slate-400 block mb-1">Torban Kana (Weekly)</span>
                <span id="stat-weekly" class="text-lg sm:text-xl font-bold">$0.00</span>
            </div>
            <div class="bg-slate-800/60 border border-slate-800 rounded-xl p-4">
                <span class="text-xs font-medium text-slate-400 block mb-1">Ji'a Kana (Monthly)</span>
                <span id="stat-monthly" class="text-lg sm:text-xl font-bold">$0.00</span>
            </div>
            <div class="bg-slate-800/60 border border-slate-800 rounded-xl p-4">
                <span class="text-xs font-medium text-slate-400 block mb-1">Total P&L</span>
                <span id="stat-net" class="text-lg sm:text-xl font-bold">$0.00</span>
            </div>
            <div class="col-span-2 md:col-span-1 bg-slate-800/60 border border-slate-800 rounded-xl p-4">
                <span class="text-xs font-medium text-slate-400 block mb-1">Win Rate</span>
                <span id="stat-winrate" class="text-lg sm:text-xl font-bold text-indigo-400">0%</span>
            </div>
        </div>

        <!-- Form & Analytics Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- Trade Input Form -->
            <div class="lg:col-span-1 bg-slate-800/80 border border-slate-800 rounded-xl p-5 shadow-lg">
                <h2 class="text-base font-semibold mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-plus-circle text-indigo-400"></i> Trade Haarawa Galmeessi
                </h2>
                <form id="tradeForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                    <input type="hidden" id="tradeId">

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Guyyaa</label>
                            <input type="date" id="tradeDate" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Pair / Asset</label>
                            <input type="text" id="tradePair" placeholder="EUR/USD, BTC..." required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 uppercase">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Gosa Trade</label>
                            <select id="tradeType" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                                <option value="LONG">LONG (Buy)</option>
                                <option value="SHORT">SHORT (Sell)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">P&L ($)</label>
                            <input type="number" step="0.01" id="tradePnl" placeholder="e.g. 150 ykn -50" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Gatii Entry ($)</label>
                            <input type="number" step="any" id="tradeEntry" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 mb-1 block">Gatii Exit ($)</label>
                            <input type="number" step="any" id="tradeExit" placeholder="0.00" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs text-slate-400 mb-1 block">Yaada (Strategy / Notes)</label>
                        <textarea id="tradeNotes" rows="2" placeholder="Breakout, Retest..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500"></textarea>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button type="submit" id="submitBtn" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2 px-4 rounded-lg transition text-sm">
                            Galmeessi
                        </button>
                        <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-300 py-2 px-3 rounded-lg text-sm">
                            Haqi
                        </button>
                    </div>
                </form>
            </div>

            <!-- Visual Charts -->
            <div class="lg:col-span-2 grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="md:col-span-2 bg-slate-800/80 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                    <h3 class="text-sm font-semibold text-slate-300 mb-2">Equity Curve (Guddataa P&L)</h3>
                    <div class="relative h-60 w-full">
                        <canvas id="equityChart"></canvas>
                    </div>
                </div>
                <div class="bg-slate-800/80 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                    <h3 class="text-sm font-semibold text-slate-300 mb-2">Mo'icha / Kasaaraa</h3>
                    <div class="relative h-60 w-full flex items-center justify-center">
                        <canvas id="winLossChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <!-- Trade History Table -->
        <div class="bg-slate-800/80 border border-slate-800 rounded-xl p-5 shadow-lg">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                <h2 class="text-base font-semibold flex items-center gap-2">
                    <i class="fa-solid fa-list text-indigo-400"></i> Seenaa Trade-otaa
                </h2>
                <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                    <select id="filterPeriod" onchange="renderApp()" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-200">
                        <option value="ALL">Hunda</option>
                        <option value="DAILY">Har'a</option>
                        <option value="WEEKLY">Torban Kana</option>
                        <option value="MONTHLY">Ji'a Kana</option>
                    </select>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/60 text-xs text-slate-400 uppercase border-b border-slate-700/50">
                        <tr>
                            <th class="py-3 px-4">Guyyaa</th>
                            <th class="py-3 px-4">Pair</th>
                            <th class="py-3 px-4">Type</th>
                            <th class="py-3 px-4">Entry / Exit</th>
                            <th class="py-3 px-4">P&L ($)</th>
                            <th class="py-3 px-4">Notes</th>
                            <th class="py-3 px-4 text-right">Tarkaanfii</th>
                        </tr>
                    </thead>
                    <tbody id="tradeTableBody" class="divide-y divide-slate-800">
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        let trades = JSON.parse(localStorage.getItem('trading_journal_trades')) || [];
        let equityChart = null;
        let winLossChart = null;

        document.getElementById('tradeDate').valueAsDate = new Date();

        function saveTrades() {
            localStorage.setItem('trading_journal_trades', JSON.stringify(trades));
        }

        function handleFormSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('tradeId').value;
            const date = document.getElementById('tradeDate').value;
            const pair = document.getElementById('tradePair').value.toUpperCase().trim();
            const type = document.getElementById('tradeType').value;
            const pnl = parseFloat(document.getElementById('tradePnl').value);
            const entry = document.getElementById('tradeEntry').value ? parseFloat(document.getElementById('tradeEntry').value) : null;
            const exit = document.getElementById('tradeExit').value ? parseFloat(document.getElementById('tradeExit').value) : null;
            const notes = document.getElementById('tradeNotes').value.trim();

            if (id) {
                trades = trades.map(t => t.id === id ? { id, date, pair, type, pnl, entry, exit, notes } : t);
            } else {
                const newTrade = { id: Date.now().toString(), date, pair, type, pnl, entry, exit, notes };
                trades.push(newTrade);
            }

            saveTrades();
            resetForm();
            renderApp();
        }

        function editTrade(id) {
            const t = trades.find(item => item.id === id);
            if (!t) return;
            document.getElementById('tradeId').value = t.id;
            document.getElementById('tradeDate').value = t.date;
            document.getElementById('tradePair').value = t.pair;
            document.getElementById('tradeType').value = t.type;
            document.getElementById('tradePnl').value = t.pnl;
            document.getElementById('tradeEntry').value = t.entry || '';
            document.getElementById('tradeExit').value = t.exit || '';
            document.getElementById('tradeNotes').value = t.notes || '';

            document.getElementById('submitBtn').innerText = 'Haroomsi (Update)';
            document.getElementById('cancelBtn').classList.remove('hidden');
        }

        function deleteTrade(id) {
            if (confirm("Trade kana haquu ni feetaa?")) {
                trades = trades.filter(t => t.id !== id);
                saveTrades();
                renderApp();
            }
        }

        function resetForm() {
            document.getElementById('tradeForm').reset();
            document.getElementById('tradeId').value = '';
            document.getElementById('tradeDate').valueAsDate = new Date();
            document.getElementById('submitBtn').innerText = 'Galmeessi';
            document.getElementById('cancelBtn').classList.add('hidden');
        }

        function renderApp() {
            renderStats();
            renderTable();
            renderCharts();
        }

        function renderStats() {
            const now = new Date();
            const todayStr = now.toISOString().split('T')[0];

            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - now.getDay());

            const dailyPnl = trades.filter(t => t.date === todayStr).reduce((sum, t) => sum + t.pnl, 0);
            const weeklyPnl = trades.filter(t => new Date(t.date) >= startOfWeek).reduce((sum, t) => sum + t.pnl, 0);
            const monthlyPnl = trades.filter(t => {
                const d = new Date(t.date);
                return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
            }).reduce((sum, t) => sum + t.pnl, 0);

            const netPnl = trades.reduce((sum, t) => sum + t.pnl, 0);
            const wins = trades.filter(t => t.pnl > 0).length;
            const winRate = trades.length > 0 ? ((wins / trades.length) * 100).toFixed(1) : '0';

            setStatElement('stat-daily', dailyPnl);
            setStatElement('stat-weekly', weeklyPnl);
            setStatElement('stat-monthly', monthlyPnl);
            setStatElement('stat-net', netPnl);
            document.getElementById('stat-winrate').innerText = `${winRate}%`;
        }

        function setStatElement(id, val) {
            const el = document.getElementById(id);
            el.innerText = `$${val.toFixed(2)}`;
            el.className = `text-lg sm:text-xl font-bold ${val >= 0 ? 'text-emerald-400' : 'text-rose-500'}`;
        }

        function renderTable() {
            const tbody = document.getElementById('tradeTableBody');
            const filter = document.getElementById('filterPeriod').value;

            let filtered = [...trades].sort((a,b) => new Date(b.date) - new Date(a.date));

            const now = new Date();
            if (filter === 'DAILY') {
                const todayStr = now.toISOString().split('T')[0];
                filtered = filtered.filter(t => t.date === todayStr);
            } else if (filter === 'WEEKLY') {
                const startOfWeek = new Date(now);
                startOfWeek.setDate(now.getDate() - now.getDay());
                filtered = filtered.filter(t => new Date(t.date) >= startOfWeek);
            } else if (filter === 'MONTHLY') {
                filtered = filtered.filter(t => {
                    const d = new Date(t.date);
                    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
                });
            }

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="text-center py-6 text-slate-500">Trade-iin galmeeffame hin jiru.</td></tr>`;
                return;
            }

            tbody.innerHTML = filtered.map(t => `
                <tr class="hover:bg-slate-800/40 transition">
                    <td class="py-3 px-4 font-mono text-xs">${t.date}</td>
                    <td class="py-3 px-4 font-bold text-slate-100">${t.pair}</td>
                    <td class="py-3 px-4">
                        <span class="text-[10px] px-2 py-0.5 rounded font-semibold ${t.type === 'LONG' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-rose-950 text-rose-400 border border-rose-800'}">
                            ${t.type}
                        </span>
                    </td>
                    <td class="py-3 px-4 text-xs text-slate-400">
                        ${t.entry ? `$${t.entry}` : '-'} / ${t.exit ? `$${t.exit}` : '-'}
                    </td>
                    <td class="py-3 px-4 font-bold ${t.pnl >= 0 ? 'text-emerald-400' : 'text-rose-500'}">
                        ${t.pnl >= 0 ? '+' : ''}$${t.pnl.toFixed(2)}
                    </td>
                    <td class="py-3 px-4 text-xs text-slate-400 max-w-xs truncate">${t.notes || '-'}</td>
                    <td class="py-3 px-4 text-right space-x-2">
                        <button onclick="editTrade('${t.id}')" class="text-indigo-400 hover:text-indigo-300"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteTrade('${t.id}')" class="text-rose-400 hover:text-rose-300"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function renderCharts() {
            const sorted = [...trades].sort((a,b) => new Date(a.date) - new Date(b.date));
            let cum = 0;
            const labels = [];
            const data = [];

            sorted.forEach(t => {
                cum += t.pnl;
                labels.push(t.date);
                data.push(cum);
            });

            if (equityChart) equityChart.destroy();
            const ctx1 = document.getElementById('equityChart').getContext('2d');
            equityChart = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels,
                    datasets: [{
                        label: 'Equity Curve',
                        data,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } },
                        y: { grid: { color: '#1e293b' }, ticks: { color: '#94a3b8' } }
                    }
                }
            });

            const wins = trades.filter(t => t.pnl > 0).length;
            const losses = trades.filter(t => t.pnl < 0).length;

            if (winLossChart) winLossChart.destroy();
            const ctx2 = document.getElementById('winLossChart').getContext('2d');
            winLossChart = new Chart(ctx2, {
                type: 'doughnut',
                data: {
                    labels: ['Win', 'Loss'],
                    datasets: [{
                        data: [wins, losses],
                        backgroundColor: ['#10b981', '#f43f5e'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { labels: { color: '#94a3b8' } } }
                }
            });
        }

        function exportToCSV() {
            if (trades.length === 0) return alert("Galmeen buufamu hin jiru!");
            let csv = "ID,Date,Pair,Type,P&L,Entry,Exit,Notes\n";
            trades.forEach(t => {
                csv += `"${t.id}","${t.date}","${t.pair}","${t.type}",${t.pnl},"${t.entry||''}","${t.exit||''}","${t.notes||''}"\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'trading_journal.csv';
            a.click();
        }

        renderApp();
    </script>
</body>
</html>
